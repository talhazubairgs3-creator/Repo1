name: Daily video index update

on:
  schedule:
    - cron: "0 6 * * *"   # 6:00 UTC every day — change the "0 6" to another hour if you prefer
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab, for testing

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the website's update endpoint
        run: |
          curl -fsS -H "X-Update-Token: ${{ secrets.UPDATE_SECRET }}" "${{ secrets.APP_URL }}/update"
